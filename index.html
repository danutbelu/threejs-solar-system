<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Sistem Solar cu Texturi</title>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <script src="lib/three.js"></script>
        <script src="lib/OrbitControls.js"></script>
        <script src="lib/dat.gui.js"></script>

        <script>
            //Dimensiunile viewport-ului (zona vizibilă din browser)
            const width = window.innerWidth;
            const height = window.innerHeight;

            //Renderer - obiectul responsabil cu desenarea scenei 3D în canvas (folosește WebGL)
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            document.body.appendChild(renderer.domElement);

            //Scena - containerul principal în care adăugăm toate obiectele 3D
            const scene = new THREE.Scene();

            //Lumină ambientală - iluminează uniform toate obiectele (evită zone complet negre)
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));

            //=====================
            // STELE (PARTICULE)
            //=====================

            //BufferGeometry este eficient pentru un număr mare de obiecte (ex: stele)
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 2000;

            const positions = [];

            //Generăm poziții random pentru fiecare stea într-un volum mare
            for (let i = 0; i < starsCount; i++) {
                positions.push(
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 200,
                    (Math.random() - 0.5) * 200
                );
            }

            //Atașăm pozițiile ca atribut al geometriei
            starsGeometry.addAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.5
            });

            //Points = sistem de particule (fiecare vertex devine o "stea")
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);

            //Camera - definește punctul de vedere al utilizatorului
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(50, 35, 50);
            camera.lookAt(scene.position);

            //Controale orbitale - permit rotație, zoom și pan cu mouse-ul
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableKeys = false;

            //Lumina principală - Soarele (PointLight emite lumină în toate direcțiile)
            const sunLight = new THREE.PointLight(0xffffff, 2);
            scene.add(sunLight);

            //Soarele - MeshBasicMaterial nu depinde de lumină (pare auto-iluminat)
            const sun = new THREE.Mesh(
                new THREE.SphereGeometry(3, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0xffcc00, reflectivity: 0.5 })
            );
            scene.add(sun);

            //Loader pentru texturi (imagini aplicate pe obiecte)
            const loader = new THREE.TextureLoader();

            //Datele planetelor (raza, textură, distanță față de Soare, viteză orbitală)
            const planetData = [
                { name: "Mercur", radius: 0.4, texture: 'textures/mercury.jpg', distance: 8, speed: 1.6 },
                { name: "Venus", radius: 0.9, texture: 'textures/venus.jpg', distance: 11, speed: 1.2 },
                { name: "Pamant", radius: 1, texture: 'textures/earth.jpg', distance: 14, speed: 1 },
                { name: "Marte", radius: 0.8, texture: 'textures/mars.jpg', distance: 17, speed: 0.8 },
                { name: "Jupiter", radius: 2, texture: 'textures/jupiter.jpg', distance: 22, speed: 0.6 },
                { name: "Saturn", radius: 1.8, texture: 'textures/saturn.jpg', distance: 27, speed: 0.5 },
                { name: "Neptun", radius: 1.3, texture: 'textures/neptune.jpg', distance: 32, speed: 0.4 },
            ];

            const planets = [];
            const pivots = [];

            //=====================
            // PLANETE + ORBITE
            //=====================
            planetData.forEach(data => {
                //Încărcăm textura planetei
                const tex = loader.load(data.texture);

                //Creăm planeta (sferă + material cu textură)
                const planet = new THREE.Mesh(
                    new THREE.SphereGeometry(data.radius, 32, 32),
                    new THREE.MeshStandardMaterial({ map: tex })
                );

                //Pivot = obiect intermediar care permite rotația (simulare orbită)
                const pivot = new THREE.Object3D();
                scene.add(pivot);

                //Poziționăm planeta la o distanță fixă față de pivot
                planet.position.set(data.distance, 0, 0);

                //Adăugăm planeta la pivot (nu direct în scenă!)
                pivot.add(planet);
                planets.push(planet);

                //Salvăm pivotul + viteza pentru animație
                pivots.push({ pivot: pivot, speedFactor: data.speed });

                //Orbita vizuală (cerc desenat în planul XZ)
                const orbGeom = new THREE.CircleGeometry(data.distance, 64);

                //Eliminăm vertex-ul central (altfel devine disc)
                orbGeom.vertices.shift();

                const orbMat = new THREE.LineBasicMaterial({ color: 0x888888 });
                const orb = new THREE.LineLoop(orbGeom, orbMat);

                //Rotim cercul pentru a fi orizontal
                orb.rotation.x = Math.PI / 2;
                scene.add(orb);
            });

            //=====================
            // ASTEROID (GEOMETRIE PROPRIE)
            //=====================
            const pivotAsteroid = new THREE.Object3D();
            scene.add(pivotAsteroid);

            function createAsteroid() {
                //Geometrie definită manual (nu primitivă)
                const geom = new THREE.Geometry();
                const verts = [];

                //Generăm vârfuri aleatorii -> formă neregulată
                for (let i = 0; i < 15; i++) {
                    verts.push(new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2,
                        (Math.random() - 0.5) * 2
                    ));
                }

                geom.vertices = verts;

                //Creăm fețe (triunghiuri) între vârfuri
                for (let i = 0; i < verts.length - 2; i++) {
                    geom.faces.push(new THREE.Face3(i, (i + 1) % verts.length, (i + 2) % verts.length));
                }

                const mat = new THREE.MeshStandardMaterial({ color: 0x333333 });

                return new THREE.Mesh(geom, mat);
            }

            const asteroid = createAsteroid();
            asteroid.position.set(35, 0, 5);
            pivotAsteroid.add(asteroid);
            pivots.push({ pivot: pivotAsteroid, speedFactor: 0.3 });

            //=====================
            // CONTROL UTILIZATOR
            //=====================

            //Parametri controlați din tastatură, mouse și GUI
            const valori = {
                speed: 0.01,
                pause: false,
                backColor: '#000000'
            };

            //Interfață grafică pentru modificare parametri
            const gui = new dat.GUI();
            gui.add(valori, 'speed', 0, 0.1).name("Viteza orbitei");
            gui.add(valori, 'pause').name("Pauza");
            gui.addColor(valori, 'backColor').name("Fundal");

            //Control tastatură
            document.addEventListener("keydown", function (event) {
                let detail = {};
                if (event.code === "ArrowUp") {
                    valori.speed += 0.005;

                    detail.speed = valori.speed; // Adăugăm viteza actualizată în detaliile evenimentului                
                }

                if (event.code === "ArrowDown") {
                    valori.speed -= 0.005;
                    detail.speed = valori.speed; // Adăugăm viteza actualizată în detaliile evenimentului
                    if (valori.speed < 0) {
                        valori.speed = 0;
                    }
                }

                if (event.code === "Space") {
                    valori.pause = !valori.pause;
                    detail.pause = valori.pause; // Adăugăm starea de pauză actualizată în detaliile evenimentului
                }

                if (Object.keys(detail).length > 0) {
                    console.log("Declansare eveniment updateGUi. Parametri actualizați:", detail);
                    document.dispatchEvent(new CustomEvent("updateGui",
                        {
                            detail: detail,
                            bubbles: true,
                            cancelable: true
                        })); // Notificăm GUI să se actualizeze
                }
            });

            document.addEventListener("updateGui", function (event) {
                if (event.detail && event.detail.speed !== undefined) {
                    gui.__controllers[0].setValue(valori.speed); // Sincronizăm cu GUI
                    console.log("Viteza actualizată:", valori.speed);
                }

                if (event.detail && event.detail.pause !== undefined) {
                    gui.__controllers[1].setValue(valori.pause); // Sincronizăm cu GUI
                    console.log("Pauza actualizată:", valori.pause);
                }

                gui.updateDisplay(); // Actualizăm afișajul GUI pentru a reflecta noile valori
            });

            //=====================
            // ANIMAȚIE
            //=====================

            function animate() {
                //Loop de animație sincronizat cu browserul
                requestAnimationFrame(animate);

                if (!valori.pause) {

                    //Rotim fiecare pivot => planetele se mișcă pe orbită
                    pivots.forEach(p => {
                        p.pivot.rotation.y += valori.speed * p.speedFactor;
                    });

                    //Rotire proprie asteroid
                    asteroid.rotation.x += 0.01;
                    asteroid.rotation.y += 0.01;
                }

                //Mișcare lentă a fundalului de stele (efect cinematic)
                stars.rotation.y += 0.0005;

                //Setăm culoarea de fundal
                renderer.setClearColor(valori.backColor);

                //Randăm scena
                renderer.render(scene, camera);
            }

            animate();
        </script>
    </body>
</html>
